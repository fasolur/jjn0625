name: Deploy to GitHub Pages

on:
  # 当前 Pages 源为「分支部署」，推送时由 GitHub 自带流程发布仓库根目录；
  # 本工作流仅在需要改为「GitHub Actions」发布、或手动指定发布子目录运行时使用。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 只发布课堂作业目录，站点根即该目录，相对路径引用（cdn/ font/ data.js 等）不会断
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "24002120625+冀佳宁"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
