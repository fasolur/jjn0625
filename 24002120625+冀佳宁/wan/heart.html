<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>大号实心粉色粒子爱心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#000;
  min-height:100vh;
  overflow:hidden;
}
canvas{
  display:block;
  width:100vw;
  height:100vh;
}
</style>
</head>
<body>
<canvas id="heart"></canvas>
<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

let W, H;
function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// 爱心内部填充采样
function getRandomHeartPoint(scale = 1){
  while(true){
    let x = (Math.random() - 0.5) * 34 * scale;
    let y = (Math.random() - 0.5) * 30 * scale;
    const eq = Math.pow(x*x + y*y - 1, 3) - x*x * y*y;
    if(eq < 0){
      return {x, y};
    }
  }
}

// 生成更多粒子，爱心整体放大
const heartTargets = [];
for(let i = 0; i < 4200; i++){
  const p = getRandomHeartPoint(14);
  heartTargets.push(p);
}

class Particle {
  constructor(){
    this.reset();
  }
  reset(){
    this.x = Math.random() * W - W/2;
    this.y = Math.random() * H - H/2;
    this.size = Math.random() * 2 + 0.8;
    this.speed = Math.random() * 0.035 + 0.01;
    this.targetIndex = Math.floor(Math.random() * heartTargets.length);
    this.alpha = Math.random() * 0.7 + 0.3;
  }
  update(){
    const target = heartTargets[this.targetIndex];
    this.x += (target.x - this.x) * this.speed;
    this.y += (target.y - this.y) * this.speed;
    this.x += (Math.random() - 0.5) * 0.3;
    this.y += (Math.random() - 0.5) * 0.3;
  }
  draw(){
    ctx.beginPath();
    ctx.fillStyle = `rgba(255, 80, 150, ${this.alpha})`;
    ctx.shadowBlur = 8;
    ctx.shadowColor = "#ff69b4";
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

const particles = [];
for(let i = 0; i < 4200; i++){
  particles.push(new Particle());
}

function animate(){
  ctx.fillStyle = "rgba(0, 0, 0, 0.18)";
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2);
  for(let p of particles){
    p.update();
    p.draw();
  }
  ctx.restore();
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
