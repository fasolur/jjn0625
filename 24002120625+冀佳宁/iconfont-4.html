<!DOCTYPE html>
<!--
  作者：冀佳宁
  建立时间：2026-10-23
  使用大模型：DeepSeek-V4.1-Flash
  功能名称：iconfont-4 · 移动端底部导航（SVG）
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>iconfont-4 · 移动端底部导航（SVG）</title>
    <!-- ===== iconfont SVG symbol 脚本 ===== -->
    <script src="./font/iconfont.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --jjn-bg: #0A0613;
            --jjn-bg-2: #10081E;
            --jjn-surface: #160C26;
            --jjn-ink: #F4EFE8;
            --jjn-ink-dim: rgba(244, 239, 232, 0.48);
            --jjn-violet: #9D4EDD;
            --jjn-violet-light: #C77DFF;
            --jjn-violet-muted: #7B2CBF;
            --jjn-cyan: #7B8DFF;
            --jjn-badge-red: #FF4D6D;
            --jjn-badge-dot: #FF5D8F;
            --jjn-rule: rgba(157, 78, 221, 0.16);
            --jjn-safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            background: var(--jjn-bg);
            color: var(--jjn-ink);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding-bottom: calc(84px + var(--jjn-safe-bottom));
            letter-spacing: -0.005em;
        }

        /* ===== 通用 SVG icon 样式 ===== */
        .jjn_svg-icon {
            width: 1em;
            height: 1em;
            vertical-align: -0.15em;
            fill: currentColor;
            overflow: hidden;
        }

        /* ===== 内容区 ===== */
        .jjn_page {
            padding: 56px 20px 40px;
            max-width: 480px;
            margin: 0 auto;
        }

        .jjn_page_num {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--jjn-violet-light);
            margin-bottom: 20px;
        }

        .jjn_page_title {
            font-weight: 700;
            font-size: 2.6rem;
            line-height: 0.95;
            letter-spacing: -0.03em;
            margin-bottom: 28px;
        }
        .jjn_page_title span { color: var(--jjn-violet-light); }

        .jjn_page_desc {
            font-size: 0.88rem;
            font-weight: 300;
            line-height: 1.8;
            color: var(--jjn-ink-dim);
            margin-bottom: 36px;
        }

        /* 示例列表 */
        .jjn_list {
            border-top: 1px solid var(--jjn-rule);
        }
        .jjn_list_item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 4px;
            border-bottom: 1px solid var(--jjn-rule);
        }
        .jjn_list_icon {
            width: 22px;
            height: 22px;
            color: var(--jjn-violet-light);
        }
        .jjn_list_main { flex: 1; }
        .jjn_list_main h4 {
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 2px;
        }
        .jjn_list_main p {
            font-size: 0.75rem;
            color: var(--jjn-ink-dim);
        }
        .jjn_list_arrow {
            font-size: 1.1rem;
            font-weight: 300;
            color: var(--jjn-violet-muted);
        }

        /* ===== 固定底部导航 ===== */
        .jjn_tabbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 999;
            width: 100%;
            background: rgba(10, 6, 19, 0.9);
            backdrop-filter: blur(28px) saturate(1.8);
            -webkit-backdrop-filter: blur(28px) saturate(1.8);
            border-top: 1px solid var(--jjn-rule);
            padding-bottom: var(--jjn-safe-bottom);
        }

        .jjn_tabbar_inner {
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            height: 64px;
            position: relative;
        }

        .jjn_tab_item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            user-select: none;
            position: relative;
            color: var(--jjn-ink-dim);
            transition: color 0.25s ease;
        }

        .jjn_tab_icon-wrap {
            position: relative;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .jjn_tab_icon {
            width: 24px;
            height: 24px;
            transition: color 0.25s ease, transform 0.25s ease;
        }

        .jjn_tab_label {
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            transition: color 0.25s ease;
        }

        /* 激活态 */
        .jjn_tab_item.active {
            color: var(--jjn-violet-light);
        }
        .jjn_tab_item.active .jjn_tab_icon {
            transform: translateY(-2px);
            filter: drop-shadow(0 0 8px rgba(199, 125, 255, 0.45));
        }
        .jjn_tab_item.active .jjn_tab_label {
            color: var(--jjn-violet-light);
            font-weight: 600;
        }

        /* ===== 徽章系统 ===== */
        .jjn_badge_num {
            position: absolute;
            top: -1px;
            right: -10px;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            background: var(--jjn-badge-red);
            border-radius: 8px;
            font-size: 0.62rem;
            font-weight: 700;
            line-height: 16px;
            text-align: center;
            color: #fff;
            box-shadow: 0 2px 8px rgba(255, 77, 109, 0.5);
            z-index: 3;
            border: 1.5px solid var(--jjn-bg);
        }

        .jjn_badge_dot {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 7px;
            height: 7px;
            background: var(--jjn-badge-dot);
            border-radius: 50%;
            box-shadow: 0 0 0 2px var(--jjn-bg);
            z-index: 3;
            animation: jjn_dotBlink 2.4s ease-in-out infinite;
        }
        @keyframes jjn_dotBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.5; transform: scale(1.3); }
        }

        .jjn_tab_item:active .jjn_tab_icon {
            transform: scale(0.85);
        }

        /* 大于 480px 时居中浮动 */
        @media (min-width: 481px) {
            .jjn_tabbar {
                left: 50%;
                transform: translateX(-50%);
                max-width: 480px;
                border-radius: 22px 22px 0 0;
            }
        }
    </style>
</head>
<body>

    <main class="jjn_page">
        <div class="jjn_page_num">No. 04 · Forms of Sign · Mobile</div>
        <h1 class="jjn_page_title">Bottom<br><span>Navigation</span></h1>
        <p class="jjn_page_desc">
            使用 iconfont SVG symbol 方式构建的移动端底部导航。图标通过 JavaScript 注入的 SVG sprite 渲染，可任意缩放、支持 currentColor 动态着色。
        </p>

        <div class="jjn_list">
            <div class="jjn_list_item">
                <svg class="jjn_list_icon jjn_svg-icon" aria-hidden="true"><use xlink:href="#icon-aichegujiabeifen5"></use></svg>
                <div class="jjn_list_main">
                    <h4>首页</h4>
                    <p>品牌动态 · 最新上架</p>
                </div>
                <span class="jjn_list_arrow">›</span>
            </div>
            <div class="jjn_list_item">
                <svg class="jjn_list_icon jjn_svg-icon" aria-hidden="true"><use xlink:href="#icon-maichepin"></use></svg>
                <div class="jjn_list_main">
                    <h4>购买</h4>
                    <p>购物车中有 3 件商品</p>
                </div>
                <span class="jjn_list_arrow">›</span>
            </div>
            <div class="jjn_list_item">
                <svg class="jjn_list_icon jjn_svg-icon" aria-hidden="true"><use xlink:href="#icon-mendian"></use></svg>
                <div class="jjn_list_main">
                    <h4>门店</h4>
                    <p>查找附近的门店</p>
                </div>
                <span class="jjn_list_arrow">›</span>
            </div>
            <div class="jjn_list_item">
                <svg class="jjn_list_icon jjn_svg-icon" aria-hidden="true"><use xlink:href="#icon-aichegujiabeifen6"></use></svg>
                <div class="jjn_list_main">
                    <h4>我的</h4>
                    <p>2 条新消息</p>
                </div>
                <span class="jjn_list_arrow">›</span>
            </div>
        </div>
    </main>

    <!-- ===== 固定底部导航栏 ===== -->
    <nav class="jjn_tabbar" id="jjn_tabbar">
        <div class="jjn_tabbar_inner">

            <!-- 首页（默认激活） -->
            <div class="jjn_tab_item active" data-target="home" onclick="jjn_switchTab(this)">
                <div class="jjn_tab_icon-wrap">
                    <svg class="jjn_tab_icon jjn_svg-icon" aria-hidden="true"><use xlink:href="#icon-aichegujiabeifen5"></use></svg>
                </div>
                <span class="jjn_tab_label">首页</span>
            </div>

            <!-- 购买（带数字徽章） -->
            <div class="jjn_tab_item" data-target="shop" onclick="jjn_switchTab(this)">
                <div class="jjn_tab_icon-wrap">
                    <svg class="jjn_tab_icon jjn_svg-icon" aria-hidden="true"><use xlink:href="#icon-maichepin"></use></svg>
                    <span class="jjn_badge_num">3</span>
                </div>
                <span class="jjn_tab_label">购买</span>
            </div>

            <!-- 门店 -->
            <div class="jjn_tab_item" data-target="store" onclick="jjn_switchTab(this)">
                <div class="jjn_tab_icon-wrap">
                    <svg class="jjn_tab_icon jjn_svg-icon" aria-hidden="true"><use xlink:href="#icon-mendian"></use></svg>
                </div>
                <span class="jjn_tab_label">门店</span>
            </div>

            <!-- 我的（带红点） -->
            <div class="jjn_tab_item" data-target="mine" onclick="jjn_switchTab(this)">
                <div class="jjn_tab_icon-wrap">
                    <svg class="jjn_tab_icon jjn_svg-icon" aria-hidden="true"><use xlink:href="#icon-aichegujiabeifen6"></use></svg>
                    <span class="jjn_badge_dot"></span>
                </div>
                <span class="jjn_tab_label">我的</span>
            </div>

        </div>
    </nav>

    <script>
        // 主要功能：切换底部导航选中项，移除其它项高亮并高亮当前项
        function jjn_switchTab(el) {
            var items = document.querySelectorAll('#jjn_tabbar .jjn_tab_item');
            for (var i = 0; i < items.length; i++) {
                items[i].classList.remove('active');
            }
            el.classList.add('active');
        }
    </script>
</body>
</html>
