<!DOCTYPE html>
<!-- 文件: frontend/ai.html
     姓名：冀佳宁 | 学号：24002120625 |
     时间：2026-11-25 | 大模型：GLM
     主要功能: 智能感知页 —— ①图像识别：上传图片→视觉模型返回中文描述；
              ②语音识别：浏览器录音（或上传音频）→ Qwen-Audio-ASR → 文字。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中华美食街 · 智能感知</title>
  <link rel="stylesheet" href="css/jjn_ai.css" />
</head>
<body>
  <main class="jjn_ai_wrap">
    <div class="jjn_ai_box">
      <header class="jjn_ai_header">
        <div class="jjn_ai_avatar">👁️</div>
        <div>
          <h1>智能感知 · 图像识别 + 语音识别</h1>
          <p>视觉：Qwen3-VL · 语音：Qwen-Audio-ASR（七牛，失败自动降级）</p>
        </div>
        <a class="jjn_ai_back" href="index.html">← 返回首页</a>
      </header>

      <!-- ===== 图像识别 ===== -->
      <section class="jjn_ai_section">
        <h2>🖼️ 图像识别（上传图片 → 描述）</h2>
        <div class="jjn_img_row">
          <div class="jjn_img_preview" id="jjn_img_preview">还没选择图片</div>
          <div class="jjn_img_ops">
            <input type="file" id="jjn_img_inp" accept="image/*" hidden />
            <button id="jjn_img_pick" class="jjn_btn">选择图片</button>
            <button id="jjn_img_go" class="jjn_btn" disabled>开始识别</button>
            <p class="jjn_tip">支持 jpg / png / webp，≤8MB</p>
          </div>
        </div>
        <div class="jjn_result" id="jjn_img_result" hidden></div>
      </section>

      <!-- ===== 语音识别 ===== -->
      <section class="jjn_ai_section">
        <h2>🎤 语音识别（录音 → 文字）</h2>
        <div class="jjn_voice_ops">
          <button id="jjn_rec_btn" class="jjn_btn jjn_rec">🎙️ 开始录音</button>
          <span id="jjn_rec_time">00:00</span>
          <span class="jjn_tip">或</span>
          <input type="file" id="jjn_audio_file" accept="audio/*,.wav,.mp3,.webm,.m4a" hidden />
          <button id="jjn_audio_pick" class="jjn_btn jjn_gray">上传音频文件</button>
        </div>
        <audio id="jjn_audio_player" controls hidden></audio>
        <div class="jjn_result" id="jjn_asr_result" hidden></div>
      </section>

      <footer class="jjn_ai_footer">24002120625 冀佳宁 · 后端 /api/ai/image、/api/ai/asr 转发 · 控制台输出发送/接收数据</footer>
    </div>
  </main>

  <script src="js/jjn_ai.js"></script>
</body>
</html>
